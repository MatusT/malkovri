[package]
name = "malkovri_wgsl_debugger"
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"

[dependencies]
serde = { version = "1.*", features = ["derive"] }
serde_json = "1.*"
naga = { version = "27.0.3", features = ["wgsl-in"] }
thiserror = "2"
glam = { version = "0.34.0", default-features = false, features = ["std", "f64", "scalar-math"] }
